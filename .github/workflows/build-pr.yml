name: build-pr
run-name: "build ${{ inputs.packages }} from ${{ inputs.repo }}#${{ inputs.pr-number }}"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "GitHub repository: owner/name"
        required: true
        type: string

      pr-number:
        description: "Pull Request number"
        required: true
        type: number

      packages:
        description: "Nix packages or flake attributes to build"
        required: true
        type: string

      x86_64-linux:
        description: "Build on x86_64-linux"
        required: true
        type: boolean
        default: true

      aarch64-linux:
        description: "Build on aarch64-linux"
        required: true
        type: boolean
        default: true

      x86_64-darwin:
        description: "Build on x86_64-darwin"
        required: true
        type: choice
        default: no
        options:
          - "no"
          - yes_sandbox_false
          - yes_sandbox_relaxed
          - yes_sandbox_true

      aarch64-darwin:
        description: "Build on aarch64-darwin"
        required: true
        type: choice
        default: yes_sandbox_relaxed
        options:
          - "no"
          - yes_sandbox_false
          - yes_sandbox_relaxed
          - yes_sandbox_true

      upterm:
        description: "Start upterm session after nix build"
        required: true
        type: boolean
        default: false

      pr-comment:
        description: "Post build results as a GitHub PR comment"
        required: true
        type: boolean
        default: true

      telegram-notification:
        description: "Send build results to Telegram"
        required: true
        type: boolean
        default: true

      upload-cachix:
        description: "Upload build targets to Cachix"
        required: true
        type: boolean
        default: true

jobs:
  check-creds:
    runs-on: ubuntu-latest
    outputs:
      gh_token: ${{ steps.check-creds.outputs.gh_token }}
      cachix: ${{ steps.check-creds.outputs.cachix }}
      tg: ${{ steps.check-creds.outputs.tg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions
            /build-pr

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - name: check credentials
        id: check-creds
        run: nu build-pr/check-creds.nu
        env:
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

  prepare:
    runs-on: ubuntu-latest
    needs: [check-creds]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions
            /build-pr
            /pr-build-support.nix

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - name: setup nix
        uses: $/.github/actions/setup-nix
        with:
          system: x86_64-linux

      - name: parse packages
        id: prepare
        run: nu build-pr/prepare.nu
        env:
          INPUTS: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ github.token }}

  build:
    name: build-${{ matrix.system }}-${{ matrix.package }}
    permissions:
      actions: read
    needs: [prepare, check-creds]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: >-
      ${{ (matrix.system == 'x86_64-linux' && 'ubuntu-latest')
      || (matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm')
      || (matrix.system == 'x86_64-darwin' && 'macos-26-intel')
      || (matrix.system == 'aarch64-darwin' && 'macos-latest') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions
            /build-pr

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: Add swap
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 15

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          extra-nix-config: ${{ vars.EXTRA_NIX_CONFIG }}
          system: ${{ matrix.system }}
          sandbox: ${{
            (matrix.system == 'x86_64-darwin' && inputs.x86_64-darwin == 'yes_sandbox_false'
            || matrix.system == 'aarch64-darwin' && inputs.aarch64-darwin == 'yes_sandbox_false') && 'false'
            || (matrix.system == 'x86_64-darwin' && inputs.x86_64-darwin == 'yes_sandbox_relaxed'
            || matrix.system == 'aarch64-darwin' && inputs.aarch64-darwin == 'yes_sandbox_relaxed') && 'relaxed'
            || 'true' }}

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.repo }}
          ref: refs/pull/${{ inputs.pr-number }}/head
          fetch-depth: 1
          path: src
          token: ${{ github.token }}

      - name: Nix build
        id: build-nu
        continue-on-error: true
        run: nu build-pr/build.nu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_SYSTEM: ${{ matrix.system }}
          MATRIX_PACKAGE: ${{ matrix.package }}

      - name: Start upterm session
        if: ${{ inputs.upterm && failure() }}
        uses: owenthereal/action-upterm@42902ffb5244d6d63501c1daf4f4ec82884025f6
        with:
          limit-access-to-actor: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_report_${{ matrix.package }}_${{ matrix.system }}.json
          path: build_report_${{ matrix.package }}_${{ matrix.system }}.json
          if-no-files-found: error

      - name: Upload to Cachix
        if: >-
          ${{
            matrix.system == 'x86_64-linux'
            && inputs.upload-cachix
            && needs.check-creds.outputs.cachix == 'true'
            && steps.build-nu.outputs.successful == 'true'
          }}
        working-directory: src
        env:
          CACHIX_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        continue-on-error: true
        run: |
          nix run nixpkgs#cachix -- authtoken "$CACHIX_TOKEN"
          nix path-info ".#${MATRIX_PACKAGE}" | xargs nix run nixpkgs#cachix -- push loneros

  report:
    runs-on: ubuntu-latest
    needs: [build, check-creds]
    if: >-
      ${{
        !cancelled()
        && (inputs.pr-comment || inputs.telegram-notification)
        && needs.build.result != 'skipped'
      }}
    outputs:
      success: ${{ steps.report.outputs.success }}

    steps:
      - name: setup rust env
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: install tera-cli
        run: cargo install --git https://github.com/chevdor/tera-cli --locked

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions
            /.github/templates
            /build-pr

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Generate and publish report
        id: report
        run: nu build-pr/report.nu
        env:
          INPUTS: ${{ toJSON(github.event.inputs) }}
          PR_ENABLED: ${{ inputs.pr-comment }}
          TG_ENABLED: ${{ inputs.telegram-notification && needs.check-creds.outputs.tg == 'true' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.pr-comment
        with:
          name: report.md
          path: report.md
          archive: false
          if-no-files-found: error

      - name: Upload TG notification
        if: inputs.telegram-notification && needs.check-creds.outputs.tg == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegram-notification.txt
          path: telegram-notification.txt
          if-no-files-found: error

  post-result:
    runs-on: ubuntu-latest
    needs: [report, check-creds]
    if: >-
      ${{
        !cancelled()
        && (inputs.pr-comment || inputs.telegram-notification)
        && needs.report.result == 'success'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions
            /build-pr

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.pr-comment
        with:
          name: report.md

      - name: Post comment and manage labels
        if: needs.check-creds.outputs.gh_token == 'true'
        run: nu build-pr/post-pr-result.nu
        env:
          INPUTS: ${{ toJSON(github.event.inputs) }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN_ENABLED: ${{ needs.check-creds.outputs.gh_token }}
          PR_ENABLED: ${{ inputs.pr-comment }}
          BUILD_SUCCESS: ${{ needs.report.outputs.success }}

      - name: Download TG notification
        if: inputs.telegram-notification && needs.check-creds.outputs.tg == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: telegram-notification.txt

      - name: Send Telegram notification
        if: inputs.telegram-notification && needs.check-creds.outputs.tg == 'true'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message_file: telegram-notification.txt
          format: html
